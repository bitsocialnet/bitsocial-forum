approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

defaultSemverRangePrefix: ""

checksumBehavior: throw

npmMinimalAgeGate: 3d

npmPreapprovedPackages:
  # The forum tracks 5chan's pkc-js / hooks versions closely so protocol fixes land here without a 3-day lag.
  - "@bitsocial/bitsocial-react-hooks"
  - "@bitsocial/bso-resolver"
  - "@pkcprotocol/pkc-js"

packageExtensions:
  element-source@0.0.5:
    peerDependencies:
      "@types/react": ">=18.0.0"
      react: ">=17.0.1"
